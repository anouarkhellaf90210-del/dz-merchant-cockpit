name: Build DZ Merchant Cockpit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APKs
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p release-out
          cp app/build/outputs/apk/release/*.apk release-out/DZ-Merchant-Cockpit.apk
          cp app/build/outputs/apk/release/*.apk release-out/app-release.apk

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.0
          name: "DZ Merchant Cockpit v3.2.0 (Official Store Source)"
          draft: false
          prerelease: false
          files: |
            release-out/DZ-Merchant-Cockpit.apk
            release-out/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
