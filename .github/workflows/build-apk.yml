name: Build DZ Merchant Cockpit APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APKs
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk release-out/DZ-Merchant-Cockpit.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-out/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DZ-Merchant-Cockpit-APK
          path: release-out/DZ-Merchant-Cockpit.apk

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.0
          name: "DZ Merchant Cockpit v3.6.0 (Original Golden Release)"
          draft: false
          prerelease: false
          files: |
            release-out/DZ-Merchant-Cockpit.apk
            release-out/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
